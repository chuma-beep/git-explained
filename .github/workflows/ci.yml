name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Install
        run: npm ci

      - name: Build every figure
        run: npm run build

      # The built pages are committed so they can be served directly. If this
      # fails, a build script changed and the output was not rebuilt.
      - name: The committed pages must match a fresh build
        run: git diff --exit-code -- '*.html'

      # Each figure must move on its own, keep zero floating line ends, and
      # write nothing to the console. A throw inside requestAnimationFrame
      # freezes a figure silently, so the motion check is the important one.
      - name: Check every figure in a browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:figures

      - name: Check the documents are in Simplified Technical English
        run: npm run test:docs
