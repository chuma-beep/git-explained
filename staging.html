<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Git staging area</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

.gs-nav{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:16px;flex-wrap:wrap;width:min(680px,100% - 32px);margin:0 auto;padding:14px 0 12px;background:linear-gradient(var(--anatomy-page) 72%,transparent);backdrop-filter:blur(6px)}
.iso-hit{fill:transparent;stroke:none}
.gs-nav-title{font:600 13px/1 var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--anatomy-strong);margin:0}
.gs-nav-sub{font:12px/1 var(--anatomy-mono);color:var(--anatomy-muted);letter-spacing:.04em}
.gs-nav-spacer{flex:1}
.gs-links{display:flex;gap:4px;flex-wrap:wrap}
.gs-links a{font:11px/1 var(--anatomy-mono);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--anatomy-muted);padding:6px 9px;border-radius:999px;border:1px solid transparent;transition:color .18s var(--anatomy-ease),border-color .18s var(--anatomy-ease)}
.gs-links a:hover{color:var(--anatomy-text);border-color:var(--anatomy-lo)}
.gs-links a[aria-current="page"]{color:var(--anatomy-strong);background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-lo) inset}
.gs-links a:focus-visible{outline:2px solid var(--anatomy-lit);outline-offset:1px}
.gs-switch{display:flex;gap:2px;padding:2px;border:1px solid var(--anatomy-lo);border-radius:999px}
.gs-switch button{font:11px/1 var(--anatomy-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--anatomy-muted);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;transition:color .18s var(--anatomy-ease),background .18s var(--anatomy-ease)}
.gs-switch button:hover{color:var(--anatomy-text)}
.gs-switch button[aria-pressed="true"]{color:var(--anatomy-strong);background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-lo) inset}
.gs-switch button:focus-visible{outline:2px solid var(--anatomy-lit);outline-offset:1px}
@media (max-width:640px){
  /* Two rows: title and switch, then the links. The links scroll sideways
     rather than wrap, so the header keeps one compact height. */
  .gs-nav{gap:8px 10px;padding:10px 0 8px;align-items:center}
  .gs-nav-title{font-size:12px;letter-spacing:.06em}
  .gs-nav-sub{display:none}
  .gs-links{order:9;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:2px;padding-bottom:2px}
  .gs-links::-webkit-scrollbar{display:none}
  .gs-links a{padding:7px 10px;font-size:10px;white-space:nowrap}
  .gs-switch button{padding:7px 12px}
  /* Less space above the figure, and a smaller plate margin. */
  .iso-page{margin:14px auto 40px}
  .iso-plate{padding:44px 12px 58px}
  .iso-figure{margin:18px 0 22px}
}
@media (max-width:380px){
  .iso-page{margin:10px auto 32px}
  .iso-plate{padding:40px 8px 54px}
  .gs-nav{gap:6px 8px}
  .gs-nav-title{font-size:11px}
  .gs-switch button{padding:6px 9px;font-size:10px}
  .gs-links a{padding:6px 8px}
}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

const P = {"origin":[320,196.75016344924833],"scale":1.3450181589058994,"azimuth":52,"elevation":30};
const PARTS = [{"kind":"plate","note":"edited"},{"kind":"rod","note":"edited"},{"kind":"gear","note":"new"},{"kind":"plate","note":"edited"}];
const COMMITS = ["a1b2c3","d4e5f6","0718ab"];
const BENCH = {"x":-150,"y":-34,"w":76,"d":62,"r":3};
const TRAY = {"x":-36,"y":-20,"w":74,"d":40,"r":2};
const RACK = {"x":50,"y":-28,"w":64,"d":60,"r":3};
const SLOTS = 4;
const RAIL_Z = 42;
const PH = 26;
const PRESS_X = -1;
const TRAY_Y = -20;
const BENCH_TOP = 16;
const TRAY_TOP = 4;

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const partsG = svg.querySelector("[data-parts]");
const cratesG = svg.querySelector("[data-crates]");
const armG = svg.querySelector("[data-arm]");
const ramG = svg.querySelector("[data-ram]");

const benchSpot = (i) => [BENCH.x + 20 + (i % 2) * 36, BENCH.y + 18 + Math.floor(i / 2) * 22, BENCH_TOP + 5];
const traySpot = (i) => [TRAY.x + 13 + i * 16, TRAY.y + 20, TRAY_TOP + 1.4];
const rackSpot = (i) => [RACK.x + 32, RACK.y + 30, 4 + i * 15];

// Where each change is: "bench", "tray", or "committed".
let spot = PARTS.map(() => "bench");
const committed = [];
let mode = "idle", t = 0, carry = -1, frame = 0, last = 0, visible = false;
let touring = !still.matches, dwell = 1.5, ramZ = 0;

const LIT = { tone: "hi", lit: true, crease: "none" };
const PLAIN = { tone: "hi", crease: "lo" };

function changeSvg(kind, x, y, z, lit) {
  const out = [];
  const body = lit ? LIT : PLAIN;
  if (kind === "plate") {
    const box = { x: x - 5.5, y: y - 4, w: 11, d: 8, r: 1 };
    out.push(solidSvg(slabOf(box, z, 3.4, P, 3, 0.3), body));
    out.push(lineSvg(planOutline(insetPlan(box, 1.3), z + 3.4, P, 3), { tone: "faint" }));
  } else if (kind === "rod") {
    out.push(solidSvg(cylinder(x, y, 2.3, z, 9, P, 14), body));
    out.push(lineSvg(ring(x, y, 2.3, z + 9, P, 14), { tone: "faint" }));
    out.push(dotsSvg([iso([x, y, z + 9], P)], { size: 0.5, tone: "hi" }));
  } else {
    out.push(solidSvg(cylinder(x, y, 4.2, z, 3, P, 20), body));
    out.push(lineSvg(knurl(x, y, 4.2, z, z + 3, 16, P), { tone: "lo" }));
    out.push(solidSvg(cylinder(x, y, 2.5, z + 3, 5.4, P, 12), body));
  }
  return out.join("");
}
function crateSvg(x, y, z, id) {
  const out = [];
  const box = { x: x - 11, y: y - 8, w: 22, d: 16, r: 1.5 };
  out.push(solidSvg(slabOf(box, z, 13, P, 4, 0.4), { tone: "mid" }));
  out.push(lineSvg(planOutline(insetPlan(box, 1.8), z + 13, P, 3), { tone: "faint" }));
  for (const dy of [-4.4, 3.6]) out.push(lineSvg(lineOnTop([x - 11, y + dy], [x + 11, y + dy], z + 13.1, P), { tone: "mid" }));
  out.push(solidSvg(slabOf({ x: x - 3, y: y - 8, w: 6, d: 16, r: 0.8 }, z + 13, 1.2, P, 3, 0.2), { tone: "hi" }));
  out.push(faceTextSvg(topMatrix([x, y], z + 13.6, P, "x"), id, { size: 3.4, tone: "lo", anchor: "middle" }));
  return out.join("");
}

// Only tray parts get a slot, so they pack from the left as they arrive.
function traySlotOf(j) { let n = 0; for (let q = 0; q < j; q++) if (spot[q] === "tray") n++; return n; }
function staged() { return spot.filter((s) => s === "tray").length; }
function onBench() { return spot.filter((s) => s === "bench").length; }

function paint() {
  const bits = [];
  for (let j = 0; j < PARTS.length; j++) {
    if (spot[j] === "bench") { const b = benchSpot(j); bits.push(changeSvg(PARTS[j].kind, b[0], b[1], b[2], false)); }
    else if (spot[j] === "tray") { const s = traySpot(traySlotOf(j)); bits.push(changeSvg(PARTS[j].kind, s[0], s[1], s[2], true)); }
  }
  partsG.innerHTML = bits.join("");
  cratesG.innerHTML = committed.map((id, i) => { const r = rackSpot(i); return crateSvg(r[0], r[1], r[2], id); }).join("");
}

function setText(text) {
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}
function describe() {
  if (mode === "add") return "git add · moving a change to the tray";
  if (mode === "commit") return "git commit · sealing " + staged() + " change(s) into a crate";
  const s = staged(), b = onBench();
  if (s) return "bench " + b + " · staged " + s + " · commit seals the tray";
  if (b) return "bench " + b + " · nothing staged · add puts a change in the tray";
  return "clean · the tray is empty and the bench is clear";
}

function addOne() {
  if (mode !== "idle" || staged() >= SLOTS) return false;
  const i = spot.indexOf("bench");
  if (i < 0) return false;
  carry = i; mode = "add"; t = 0; run(); return true;
}
function commitTray() {
  if (mode !== "idle" || staged() === 0) return false;
  mode = "commit"; t = 0; run(); return true;
}
function reset() {
  spot = PARTS.map(() => "bench");
  committed.length = 0;
  ramZ = 0;
  paint();
}
function poke(what) {
  touring = false;
  clearTimeout(poke.t);
  if (mode === "idle") {
    if (what === "commit") commitTray();
    else if (!addOne()) commitTray();
  }
  poke.t = setTimeout(() => { touring = !still.matches; dwell = 1.9; run(); }, 4200);
}

function armAt(x, y, z) {
  return lineSvg(rise([x, y], RAIL_Z, z + 5, P), { tone: "faint" })
    + solidSvg(slabOf({ x: x - 7, y: y - 5, w: 14, d: 10, r: 1.6 }, z + 5, 5, P, 3, 0.3), { tone: "mid" });
}

const MOVE = 1.6;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (mode === "add") {
    t = Math.min(1, t + dt / MOVE);
    const e = t * t * (3 - 2 * t);
    const i = carry;
    const from = benchSpot(i), to = traySpot(staged());
    const lift = Math.sin(Math.PI * e) * 24;
    const x = from[0] + (to[0] - from[0]) * e;
    const y = from[1] + (to[1] - from[1]) * e;
    const z = from[2] + (to[2] - from[2]) * e + lift;
    const bits = [];
    for (let j = 0; j < PARTS.length; j++) {
      if (j === i) continue;
      if (spot[j] === "bench") { const b = benchSpot(j); bits.push(changeSvg(PARTS[j].kind, b[0], b[1], b[2], false)); }
      else if (spot[j] === "tray") { const s = traySpot(traySlotOf(j)); bits.push(changeSvg(PARTS[j].kind, s[0], s[1], s[2], true)); }
    }
    bits.push(changeSvg(PARTS[i].kind, x, y, z, true));
    partsG.innerHTML = bits.join("");
    armG.innerHTML = armAt(x, y, z);
    if (t >= 1) { spot[i] = "tray"; carry = -1; mode = "idle"; t = 0; armG.innerHTML = ""; paint(); }
  } else if (mode === "commit") {
    t = Math.min(1, t + dt / MOVE);
    ramZ = t < 0.5 ? (t / 0.5) * 30 : (1 - (t - 0.5) / 0.5) * 30;
    ramG.innerHTML = solidSvg(cylinder(PRESS_X, TRAY_Y + 9, 3.8, PH + 11 - ramZ, 6, P, 18), { tone: "hi" });
    if (t >= 1) {
      committed.push(COMMITS[committed.length % COMMITS.length]);
      for (let i = 0; i < spot.length; i++) if (spot[i] === "tray") spot[i] = "committed";
      ramZ = 0; ramG.innerHTML = ""; mode = "idle"; t = 0;
      paint();
    }
  } else if (touring) {
    dwell -= dt;
    if (dwell <= 0) {
      if (staged() >= 2 || onBench() === 0) { if (staged()) commitTray(); else reset(); }
      else addOne();
      dwell = 1.9;
    }
  }
  if (mode === "idle") { armG.innerHTML = ""; }
  setText(describe());
  frame = visible && (mode !== "idle" || touring) ? requestAnimationFrame(tick) : 0;
}

const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((es) => { visible = es[es.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("click", () => poke("add"));
stage.addEventListener("keydown", (e) => {
  if (e.key === "a" || e.key === "A") { e.preventDefault(); poke("add"); }
  if (e.key === "c" || e.key === "C") { e.preventDefault(); poke("commit"); }
});
paint();
setText(describe());

{
  const root = document.body;
  const saved = localStorage.getItem("gs-theme");
  if (saved === "light" || saved === "dark") root.dataset.theme = saved;
  const themeButtons = [...document.querySelectorAll("[data-set-theme]")];
  const syncTheme = () => {
    for (const b of themeButtons) b.setAttribute("aria-pressed", String(b.dataset.setTheme === root.dataset.theme));
  };
  syncTheme();
  for (const b of themeButtons) b.addEventListener("click", () => {
    root.dataset.theme = b.dataset.setTheme;
    localStorage.setItem("gs-theme", b.dataset.setTheme);
    syncTheme();
  });
  // A touch screen has no hover. Swap the hint for one that names a gesture.
  const touchStage = document.querySelector(".iso-stage");
  if (touchStage && touchStage.dataset.touchHint && matchMedia("(hover: none)").matches) {
    const hint = document.querySelector('[data-corner="hint"]');
    if (hint) hint.textContent = touchStage.dataset.touchHint;
  }
}
